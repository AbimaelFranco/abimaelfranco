<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="GitHub telemetry: public repos, stars, followers and top languages">
<title>GitHub telemetry</title>
<defs>
  <filter id="glowS" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#212830"/><stop offset="1" stop-color="#1a2028"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#8ff8ff"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00f0ff" stroke-opacity=".05"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
  <clipPath id="card"><polygon points="0,0 974,0 1000,26 1000,300 26,300 0,274"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <text x="36" y="42" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#00f0ff" opacity=".85">// PROFILE.STATS</text>
  <text x="536" y="42" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#00f0ff" opacity=".85">// TOP.LANGUAGES</text>
  <line x1="500" y1="34" x2="500" y2="266" stroke="#00f0ff" stroke-opacity=".22"/>
  <text x="60" y="110" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#e6fbff" filter="url(#glowS)">47</text><text x="60" y="130" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">PUBLIC REPOS</text><text x="320" y="110" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#e6fbff" filter="url(#glowS)">30</text><text x="320" y="130" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">TOTAL STARS</text><text x="60" y="188" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#e6fbff" filter="url(#glowS)">6</text><text x="60" y="208" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">FOLLOWERS</text><text x="320" y="188" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#e6fbff" filter="url(#glowS)">2021</text><text x="320" y="208" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">MEMBER SINCE</text>
  <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace"><text x="560" y="92" font-size="12" fill="#e6fbff" opacity=".9">Python</text><text x="900" y="92" text-anchor="end" font-size="11" fill="#8ff8ff">84.3%</text><rect x="560" y="98" width="340" height="8" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".25"/><rect x="560" y="98" width="0" height="8" fill="url(#bar)" filter="url(#glowS)" opacity="0"><animate attributeName="width" values="0;286.6" dur=".8s" begin="0s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur=".3s" begin="0s" fill="freeze"/></rect></g><g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace"><text x="560" y="126" font-size="12" fill="#e6fbff" opacity=".9">CSS</text><text x="900" y="126" text-anchor="end" font-size="11" fill="#8ff8ff">4.3%</text><rect x="560" y="132" width="340" height="8" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".25"/><rect x="560" y="132" width="0" height="8" fill="url(#bar)" filter="url(#glowS)" opacity="0"><animate attributeName="width" values="0;14.6" dur=".8s" begin="0.15s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur=".3s" begin="0.15s" fill="freeze"/></rect></g><g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace"><text x="560" y="160" font-size="12" fill="#e6fbff" opacity=".9">HTML</text><text x="900" y="160" text-anchor="end" font-size="11" fill="#8ff8ff">2.4%</text><rect x="560" y="166" width="340" height="8" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".25"/><rect x="560" y="166" width="0" height="8" fill="url(#bar)" filter="url(#glowS)" opacity="0"><animate attributeName="width" values="0;8.2" dur=".8s" begin="0.3s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur=".3s" begin="0.3s" fill="freeze"/></rect></g><g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace"><text x="560" y="194" font-size="12" fill="#e6fbff" opacity=".9">JavaScript</text><text x="900" y="194" text-anchor="end" font-size="11" fill="#8ff8ff">2.3%</text><rect x="560" y="200" width="340" height="8" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".25"/><rect x="560" y="200" width="0" height="8" fill="url(#bar)" filter="url(#glowS)" opacity="0"><animate attributeName="width" values="0;7.8" dur=".8s" begin="0.45s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur=".3s" begin="0.45s" fill="freeze"/></rect></g><g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace"><text x="560" y="228" font-size="12" fill="#e6fbff" opacity=".9">Cython</text><text x="900" y="228" text-anchor="end" font-size="11" fill="#8ff8ff">1.9%</text><rect x="560" y="234" width="340" height="8" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".25"/><rect x="560" y="234" width="0" height="8" fill="url(#bar)" filter="url(#glowS)" opacity="0"><animate attributeName="width" values="0;6.5" dur=".8s" begin="0.6s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur=".3s" begin="0.6s" fill="freeze"/></rect></g>
  <text x="36" y="278" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10" fill="#56728a">SOURCE: GITHUB API · SNAPSHOT</text>
  <rect width="1000" height="300" fill="url(#scan)"/>
</g>
<polygon points="1,1 973,1 999,27 999,299 27,299 1,273" fill="none" stroke="#00f0ff" stroke-opacity=".5" stroke-width="1.2"/><path d="M1 60V1h60" fill="none" stroke="#8ff8ff" stroke-width="2.5"/><path d="M999 240V299H940" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
</svg>
