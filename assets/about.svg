<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="About me: Electronics Engineer and Data &amp; BI Specialist summary">
<title>About me</title>
<defs>
  <filter id="glowS" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b0d"/><stop offset="1" stop-color="#081418"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00f0ff" stroke-opacity=".05"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
  <clipPath id="card"><polygon points="0,0 974,0 1000,26 1000,300 26,300 0,274"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <text x="36" y="42" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#00f0ff" opacity=".85">// ABOUT.ME</text>
  <text x="36" y="66" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" fill="#8ff8ff" opacity=".9">&gt; cat bio.md</text>
  <g filter="url(#glowS)"><text x="60" y="96" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">Electronics Engineer with hands-on experience building technology<animate attributeName="opacity" values="0;1" dur=".6s" begin="0s" fill="freeze"/></text><text x="60" y="120" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">solutions across automation, embedded systems and data analysis.<animate attributeName="opacity" values="0;1" dur=".6s" begin="0.18s" fill="freeze"/></text><text x="60" y="144" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">Comfortable bridging hardware and software — sensors, microcontrollers<animate attributeName="opacity" values="0;1" dur=".6s" begin="0.36s" fill="freeze"/></text><text x="60" y="168" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">and embedded Linux on one side; Python, SQL and BI dashboards on the other.<animate attributeName="opacity" values="0;1" dur=".6s" begin="0.54s" fill="freeze"/></text><text x="60" y="192" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">Currently a Data &amp; BI Strategy Specialist at BAC, automating reporting<animate attributeName="opacity" values="0;1" dur=".6s" begin="0.72s" fill="freeze"/></text><text x="60" y="216" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" fill="#e6fbff" opacity="0">pipelines and building dashboards for operational decision-making.<animate attributeName="opacity" values="0;1" dur=".6s" begin="0.9s" fill="freeze"/></text></g>

  <line x1="638" y1="34" x2="638" y2="260" stroke="#00f0ff" stroke-opacity=".22"/>
  <text x="668" y="66" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#8ff8ff" opacity=".9">// QUICK.FACTS</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.4s" fill="freeze"/><rect x="668" y="89" width="7" height="7" fill="#8ff8ff"/><text x="684" y="97" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">ROLE</text><text x="684" y="113" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" fill="#e6fbff">Data &amp; BI Strategy Specialist @ BAC</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.55s" fill="freeze"/><rect x="668" y="133" width="7" height="7" fill="#8ff8ff"/><text x="684" y="141" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">STUDY</text><text x="684" y="157" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" fill="#e6fbff">B.Sc. Electronic Engineering, USAC</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.7s" fill="freeze"/><rect x="668" y="177" width="7" height="7" fill="#8ff8ff"/><text x="684" y="185" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">ABROAD</text><text x="684" y="201" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" fill="#e6fbff">Semiconductor Training — Taiwan ICDF</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.85s" fill="freeze"/><rect x="668" y="221" width="7" height="7" fill="#8ff8ff"/><text x="684" y="229" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2" fill="#00f0ff">LANGUAGE</text><text x="684" y="245" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" fill="#e6fbff">English — B1+</text></g>

  <rect x="36" y="254" width="928" height="1" fill="#00f0ff" opacity=".2"/>
  <text x="36" y="278" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" fill="#56728a">&gt; <tspan fill="#8ff8ff">turning technical requirements into working systems_</tspan>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5001;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <rect width="1000" height="300" fill="url(#scan)"/>
</g>
<polygon points="1,1 973,1 999,27 999,299 27,299 1,273" fill="none" stroke="#00f0ff" stroke-opacity=".5" stroke-width="1.2"/><path d="M1 60V1h60" fill="none" stroke="#8ff8ff" stroke-width="2.5"/><path d="M999 240V299H940" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
</svg>
